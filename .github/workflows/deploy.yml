name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_APPROVAL_TABLE_ID: ${{ secrets.BITABLE_APPROVAL_TABLE_ID }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
          APPROVERS: ${{ secrets.APPROVERS }}
          CRON_SCHEDULE: ${{ secrets.CRON_SCHEDULE }}
        run: |
          ssh -o StrictHostKeyChecking=no -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            if [ ! -d $DEPLOY_PATH ]; then
              mkdir -p $DEPLOY_PATH
              cd $DEPLOY_PATH
              git init
              git remote add origin https://github.com/NepheLoudy/approval-bot.git
            fi
            cd $DEPLOY_PATH
            git fetch origin main
            git reset --hard origin/main

            npm install --production

            cat > .env << EOF
          PORT=3002
          APP_ID=${APP_ID}
          APP_SECRET=${APP_SECRET}
          BITABLE_APP_TOKEN=${BITABLE_APP_TOKEN}
          BITABLE_APPROVAL_TABLE_ID=${BITABLE_APPROVAL_TABLE_ID}
          FEISHU_VERIFICATION_TOKEN=
          FEISHU_ENCRYPT_KEY=
          FEISHU_USE_LONG_CONNECTION=true
          BOT_NAME=${BOT_NAME}
          BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL}
          BOT_CHAT_ID=${BOT_CHAT_ID}
          APPROVERS=${APPROVERS}
          CRON_SCHEDULE=${CRON_SCHEDULE}
          EOF

            pm2 delete approval-bot 2>/dev/null || true
            pm2 start src/index.js --name approval-bot
            pm2 save
          "
